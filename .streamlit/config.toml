[theme]
base = "light"
primaryColor = "#5274c4"
backgroundColor = "#f5f6fa"
secondaryBackgroundColor = "#eef0f6"
textColor = "#2b2d42"
borderColor = "#e2e4ee"
showWidgetBorder = true
baseRadius = "8px"
buttonRadius = "8px"
baseFontSize = 14
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFontWeights = [700, 650, 600, 600, 600, 600]
dataframeHeaderBackgroundColor = "#f5f6fa"
showSidebarBorder = true
chartCategoricalColors = ["#7fa6e3", "#f2a07b", "#6fc4a1", "#f0c75e", "#eb9cc0", "#9cc47a", "#a99be3", "#e98b8b"]

[theme.sidebar]
backgroundColor = "#fbfbfd"
secondaryBackgroundColor = "#eff1f7"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[browser]
gatherUsageStats = false
