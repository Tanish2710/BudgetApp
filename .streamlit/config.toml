[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f7f7f5"
secondaryBackgroundColor = "#efeee9"
textColor = "#1a1a19"
borderColor = "#e3e2dc"
showWidgetBorder = true
baseRadius = "8px"
buttonRadius = "8px"
baseFontSize = 14
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFontWeights = [700, 650, 600, 600, 600, 600]
dataframeHeaderBackgroundColor = "#f7f7f5"
showSidebarBorder = true
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f4f1"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[browser]
gatherUsageStats = false
